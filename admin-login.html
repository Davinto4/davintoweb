<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - DavintoWeb</title>
  <link rel="stylesheet" href="style.css">
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";const firebaseConfig = {
  apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
  authDomain: "davintoweb-payments.firebaseapp.com",
  databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
  projectId: "davintoweb-payments",
  storageBucket: "davintoweb-payments.firebasestorage.app",
  messagingSenderId: "667742200333",
  appId: "1:667742200333:web:cf75f6cef6798eed432b44"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {
      const user = userCredential.user;
      if (user.emailVerified) {
        window.location.href = "admin.html";
      } else {
        alert("Please verify your email first. Check your inbox.");
        sendEmailVerification(user).then(() => {
          alert("Verification email sent again to " + email);
        });
      }
    })
    .catch((error) => {
      alert("Login failed: " + error.message);
    });
});

// Optional: Redirect if already logged in
onAuthStateChanged(auth, (user) => {
  if (user && user.emailVerified) {
    window.location.href = "admin.html";
  }
});

  </script>
</head>
<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>

<!-- admin-login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - DavintoWeb</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-section">
    <h2>Admin Login</h2>
    <input type="email" id="login-email" placeholder="Email" required><br>
    <input type="password" id="login-password" placeholder="Password" required><br>
    <button onclick="login()">Login</button><br>
    <small><a href="#" onclick="resendVerificationEmail()">Resend Verification Email</a></small>
    <p id="login-error" style="color: red;"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "667742200333",
      appId: "1:667742200333:web:cf75f6cef6798eed432b44"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    window.login = () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorElem = document.getElementById('login-error');

      signInWithEmailAndPassword(auth, email, password)
        .then(userCredential => {
          const user = userCredential.user;
          if (!user.emailVerified) {
            errorElem.textContent = "Please verify your email before continuing.";
          } else {
            // Redirect to dashboard
            window.location.href = "admin.html";
          }
        })
        .catch(error => {
          errorElem.textContent = error.message;
        });
    };

    window.resendVerificationEmail = () => {
      const user = auth.currentUser;
      if (user && !user.emailVerified) {
        sendEmailVerification(user).then(() => {
          alert("Verification email sent.");
        });
      } else {
        alert("You must be logged in to resend verification.");
      }
    };
  </script>
</body>
</html>

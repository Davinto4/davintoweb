<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Payment</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>
</head>
<body class="main-layout">
  <!-- Navbar -->
  <div class="navbar">
    <button onclick="window.location.href='index.html'">Home</button>
    <button onclick="window.location.href='about.html'">About</button>
    <button onclick="window.location.href='pricing.html'">Pricing</button>
    <button onclick="window.location.href='portfolio.html'">Portfolio</button>
    <button onclick="window.location.href='confirm.html'">Confirm</button>
  </div>

  <!-- Page Content -->
  <div class="container">
    <h2>Payment Confirmation</h2>

    <form id="paymentForm">
      <label>Full Name</label>
      <input type="text" id="name" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Account Used</label>
      <input type="text" id="account" required>

      <label>Message (optional)</label>
      <textarea id="message" placeholder="I paid for..."></textarea>

      <button type="submit">Submit</button>
      <div id="loader" style="display: none;">Submitting...</div>
    </form>

    <audio id="successSound" src="success.mp3" preload="auto"></audio>
  </div>

  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDhgq6vM5FVEv16Pf6Pba07YjflAJDdWTA",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "302344813751",
      appId: "1:302344813751:web:f5cb2a6ea2f81e3b81e27b"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const form = document.getElementById("paymentForm");
    const loader = document.getElementById("loader");
    const sound = document.getElementById("successSound");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const account = document.getElementById("account").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !email || !account) {
        alert("Please fill in all required fields.");
        return;
      }

      loader.style.display = "block";

      const paymentRef = database.ref("payments").push();
      paymentRef.set({
        name,
        email,
        account,
        message,
        timestamp: new Date().toISOString()
      }).then(() => {
        loader.style.display = "none";
        sound.play();
        alert("Payment Confirmed Successfully ✅");
        form.reset();
      }).catch(error => {
        loader.style.display = "none";
        alert("Error: " + error.message);
      });
    });
  </script>
</body>
</html>

<!-- confirm.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Payment</title>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>
</head>
<body>
  <h2>Confirm Payment</h2>
  <form id="paymentForm">
    <input type="text" id="name" placeholder="Your Name" required><br>
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="text" id="account" placeholder="Bank Account Used" required><br>
    <input type="text" id="service" readonly><br>
    <textarea id="message" placeholder="Optional message"></textarea><br>
    <button type="submit">Submit Confirmation</button>
  </form>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDp-fKxNVoGVzeS-Vm1xHMCMpuXenJ7b0Y",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "617117668385",
      appId: "1:617117668385:web:b44215fd840684fdf11320"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    document.getElementById("service").value = new URLSearchParams(window.location.search).get("service") || "";

    document.getElementById("paymentForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        account: document.getElementById("account").value,
        service: document.getElementById("service").value,
        message: document.getElementById("message").value
      };
      db.ref("payments").push(data).then(() => {
        alert("Payment confirmed!");
        this.reset();
      });
    });
  </script>
</body>
</html>

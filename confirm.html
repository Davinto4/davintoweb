<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Payment</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 255, 100, 0.2);
    }
    input, textarea, select, button {
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.8rem;
      border: none;
      border-radius: 5px;
    }
    button {
      background: #00c851;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .loader {
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Confirm Your Payment</h2>
    <form id="confirmForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="text" id="account" placeholder="Bank Account Used" required />
      <textarea id="message" placeholder="Your message (optional)" rows="3"></textarea>
      <select id="service">
        <option value="Web Design">Web Design</option>
        <option value="E-Commerce">E-Commerce</option>
        <option value="Portfolio">Portfolio Website</option>
        <option value="Landing Page">Landing Page</option>
      </select>
      <button type="submit">Submit Confirmation</button>
      <div class="loader" id="loader">⏳ Submitting...</div>
    </form>
  </div>

  <audio id="successSound" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKU...",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "74873314586",
      appId: "1:74873314586:web:10ec..."
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    document.getElementById("confirmForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const loader = document.getElementById("loader");
      loader.style.display = "block";

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const account = document.getElementById("account").value;
      const message = document.getElementById("message").value;
      const service = document.getElementById("service").value;

      const data = {
        name,
        email,
        account,
        message,
        service,
        timestamp: new Date().toISOString()
      };

      // Push to Firebase
      db.ref("payments").push(data)
        .then(() => {
          document.getElementById("successSound").play();

          // Send WhatsApp alert
          const whatsappLink = `https://api.whatsapp.com/send?phone=2348169045105&text=New%20Payment%20Confirmation:%0AName:%20${encodeURIComponent(name)}%0AEmail:%20${encodeURIComponent(email)}%0AAccount:%20${encodeURIComponent(account)}%0AService:%20${encodeURIComponent(service)}%0AMessage:%20${encodeURIComponent(message)}`;
          window.open(whatsappLink, "_blank");

          loader.style.display = "none";
          alert("Confirmation submitted successfully!");
          document.getElementById("confirmForm").reset();
        })
        .catch((err) => {
          loader.style.display = "none";
          alert("Error submitting confirmation: " + err.message);
        });
    });
  </script>
</body>
</html>

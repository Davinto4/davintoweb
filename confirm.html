<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirm Payment - DavintoWeb</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #1f1f1f, #2e2e2e);
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 500px;
      margin: 80px auto;
      background: #2b2b2b;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
    }
    h2 {
      text-align: center;
      color: #00ffcc;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    input, textarea, select, button {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    input, textarea {
      background: #444;
      color: #fff;
    }
    button {
      background: #00ffcc;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .loader {
      display: none;
      text-align: center;
    }
    .success-sound {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Confirm Your Payment</h2>
    <form id="confirmForm">
      <input type="text" id="name" placeholder="Your Full Name" required />
      <input type="email" id="email" placeholder="Your Email Address" required />
      <input type="text" id="account" placeholder="Account Used for Payment" required />
      <textarea id="message" rows="3" placeholder="Optional Message"></textarea>
      <select id="service" required>
        <option value="">Select a Service</option>
        <option value="Website Design">Website Design</option>
        <option value="Landing Page">Landing Page</option>
        <option value="Portfolio Site">Portfolio Site</option>
        <option value="Ecommerce Website">Ecommerce Website</option>
        <option value="Custom Request">Custom Request</option>
      </select>
      <button type="submit" id="submitBtn">Submit Confirmation</button>
      <div class="loader" id="loader">Submitting...</div>
    </form>
    <audio id="successSound" class="success-sound">
      <source src="https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.wav" type="audio/wav">
    </audio>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDXwXyA92K9tkMAlQ-LXWc-ntbqFGYW3ig",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "662323460416",
      appId: "1:662323460416:web:070e6a79eb1830837f4ed6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const form = document.getElementById('confirmForm');
    const loader = document.getElementById('loader');
    const submitBtn = document.getElementById('submitBtn');
    const successSound = document.getElementById('successSound');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      loader.style.display = 'block';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const account = document.getElementById('account').value.trim();
      const message = document.getElementById('message').value.trim();
      const service = document.getElementById('service').value;

      const data = {
        name,
        email,
        account,
        message,
        service,
        timestamp: new Date().toISOString()
      };

      try {
        await db.ref('payments').push(data);
        loader.style.display = 'none';
        submitBtn.disabled = false;
        successSound.play();
        alert('Payment confirmation submitted successfully!');
        form.reset();
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to submit. Please try again.');
        loader.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

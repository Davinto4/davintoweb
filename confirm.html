<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Payment</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #111, #1e1e1e);
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 500px;
      margin: 80px auto;
      padding: 30px;
      background: #222;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
    }
    h2 {
      text-align: center;
    }
    form input, form textarea, form button {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    form input, form textarea {
      background: #333;
      color: white;
    }
    form button {
      background: #00b894;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    form button:hover {
      background: #019875;
    }
    #loader {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    audio {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Music Player (Random track) -->
  <audio autoplay loop id="bgMusic"></audio>

  <div class="container">
    <h2>Confirm Your Payment</h2>
    <form id="confirmForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <input type="text" id="account" placeholder="Account Used for Payment" required />
      <textarea id="message" placeholder="Your Message (optional)"></textarea>
      <button type="submit">Submit Confirmation</button>
    </form>
    <div id="loader">
      <p>Submitting...</p>
    </div>
    <audio id="successSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_e2c6cf81dc.mp3" preload="auto"></audio>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDj3V9q-UYwABzYRuK0APxz4ihJSQss2ZY",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "150083370230",
      appId: "1:150083370230:web:6e6f185b58ae95aa4be9b6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Music player logic
    const musicList = [
      "https://cdn.pixabay.com/audio/2023/05/06/audio_2037a731c7.mp3", // Pop Smoke Style
      "https://cdn.pixabay.com/audio/2022/03/19/audio_6ab3a1bfb1.mp3", // Gospel Chill
      "https://cdn.pixabay.com/audio/2023/03/31/audio_4e96590d57.mp3", // Rap Beat
      "https://cdn.pixabay.com/audio/2023/01/18/audio_efc69edcc3.mp3", // Juice WRLD Type
      "https://cdn.pixabay.com/audio/2023/07/09/audio_4b192ff3df.mp3"  // XXXTentacion Style
    ];
    const bgMusic = document.getElementById("bgMusic");
    bgMusic.src = musicList[Math.floor(Math.random() * musicList.length)];

    // Submit logic
    document.getElementById("confirmForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const account = document.getElementById("account").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !email || !account) {
        alert("Please fill all required fields.");
        return;
      }

      document.getElementById("loader").style.display = "block";

      const newRef = db.ref("confirmations").push();
      newRef.set({
        name,
        email,
        account,
        message,
        timestamp: new Date().toISOString()
      }).then(() => {
        document.getElementById("loader").style.display = "none";
        document.getElementById("successSound").play();
        alert("Payment Confirmation Submitted Successfully!");
        document.getElementById("confirmForm").reset();
      }).catch(err => {
        alert("Error: " + err.message);
        document.getElementById("loader").style.display = "none";
      });
    });
  </script>

  <!-- SmartUpp Live Chat -->

    })(document);
  </script>
</body>
</html>

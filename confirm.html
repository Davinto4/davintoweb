<!-- confirm.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Confirmation</title>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: white; padding: 20px; }
    input, textarea, button { padding: 10px; margin: 8px; display: block; width: 100%; max-width: 400px; }
  </style>
</head>
<body>
  <h2>Confirm Your Payment</h2>
  <input type="text" id="name" placeholder="Your Name" />
  <input type="email" id="email" placeholder="Email Address" />
  <input type="text" id="account" placeholder="Account Used" />
  <textarea id="message" placeholder="Message (optional)"></textarea>
  <input type="text" id="service" placeholder="Service Paid For" />
  <button onclick="submitConfirmation()">Submit</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBqpSTk-zJvTwRijvnHVg8GcUkJ-fOaQSo",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "364768711223",
      appId: "1:364768711223:web:058927fe03f503a8a4a541"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function submitConfirmation() {
      const data = {
        name: name.value,
        email: email.value,
        account: account.value,
        message: message.value,
        service: service.value,
        time: new Date().toISOString()
      };
      db.ref("payments").push(data).then(() => {
        alert("Payment confirmation submitted.");
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DavintoWeb Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 8px; border: 1px solid #ccc; }
    input, textarea, select, button { padding: 8px; margin: 5px; width: 100%; }
    .admin-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px #ddd; margin-bottom: 30px; }
  </style>
</head>
<body>  <div id="loginForm" class="admin-section">
    <h2>Login to Admin</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="resendVerificationEmail()">Resend Verification Email</button>
  </div>  <div id="adminPanel" class="hidden"><div class="admin-section">
  <h2>Post New Portfolio Project</h2>
  <input type="text" id="projectTitle" placeholder="Project Title">
  <input type="text" id="projectImage" placeholder="Image URL">
  <textarea id="projectDesc" placeholder="Project Description"></textarea>
  <button onclick="postProject()">Post Project</button>
</div>

<div class="admin-section">
  <h2>Portfolio Projects</h2>
  <table id="portfolioTable"><thead><tr><th>Title</th><th>Description</th><th>Image</th><th>Actions</th></tr></thead><tbody></tbody></table>
</div>

<div class="admin-section">
  <h2>Payment Confirmations</h2>
  <button onclick="exportTableToCSV('payments.csv', 'paymentsTable')">Export Payments CSV</button>
  <table id="paymentsTable"><thead><tr><th>Name</th><th>Email</th><th>Account</th><th>Message</th><th>Actions</th></tr></thead><tbody></tbody></table>
</div>

<div class="admin-section">
  <h2>Manage Users & Roles</h2>
  <table id="rolesTable"><thead><tr><th>UID</th><th>Email</th><th>Role</th><th>Set Role</th></tr></thead><tbody></tbody></table>
</div>

<div class="admin-section">
  <h2>Send Message to Users</h2>
  <input type="text" id="messageTo" placeholder="User UID">
  <textarea id="messageBody" placeholder="Your message here"></textarea>
  <button onclick="sendMessage()">Send</button>
</div>

<button onclick="logout()">Logout</button>

  </div>  <!-- Firebase SDK -->  <script type="module" src="admin.js"></script></body>
</html>

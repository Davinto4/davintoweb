<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Davinto Admin Panel</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
    #loginForm, #adminPanel { display: none; }
    .section { margin-bottom: 20px; }
    input, button, select { margin: 5px; padding: 6px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; background: #1e1e1e; color: white; }
    th, td { border: 1px solid #555; padding: 8px; text-align: left; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h2>DAVINTOWEB ADMIN PANEL</h2>

  <!-- Login Form -->
  <div id="loginForm">
    <h3>Login</h3>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>

  <!-- Email Verification -->
  <div id="verifyEmail" class="hidden">
    <p>Please verify your email.</p>
    <button onclick="resendVerification()">Resend Verification Email</button>
    <button onclick="checkVerification()">I've Verified</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel">
    <p>Welcome, <span id="currentUserEmail"></span> | Role: <span id="currentUserRole"></span></p>
    <button onclick="logout()">Logout</button>

    <div class="section">
      <h3>Payments</h3>
      <button onclick="exportCSV('payments')">Export CSV</button>
      <table id="paymentsTable">
        <thead><tr><th>Name</th><th>Email</th><th>Account</th><th>Message</th><th>Action</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="section">
      <h3>Portfolio</h3>
      <input type="text" id="projectTitle" placeholder="Project Title">
      <input type="text" id="projectImage" placeholder="Image URL">
      <input type="text" id="projectLink" placeholder="Project Link">
      <button onclick="addProject()">Add Project</button>
      <button onclick="exportCSV('portfolio')">Export CSV</button>
      <table id="portfolioTable">
        <thead><tr><th>Title</th><th>Image</th><th>Link</th><th>Action</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="section" id="manageUsersSection">
      <h3>User Roles (Super Admin Only)</h3>
      <table id="userTable">
        <thead><tr><th>Email</th><th>Role</th><th>Change Role</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "667742200333",
      appId: "1:667742200333:web:cf75f6cef6798eed432b44"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const rolesRef = db.ref("roles");

    const superAdmin = "macdinodavinto@gmail.com";

    function $(id) {
      return document.getElementById(id);
    }

    function login() {
      const email = $("email").value;
      const password = $("password").value;
      auth.signInWithEmailAndPassword(email, password).catch(alert);
    }

    function signup() {
      const email = $("email").value;
      const password = $("password").value;
      auth.createUserWithEmailAndPassword(email, password).then(user => {
        user.user.sendEmailVerification();
        rolesRef.child(user.user.uid).set({ role: "viewer" });
        alert("Verify your email before accessing the dashboard.");
      }).catch(alert);
    }

    function logout() {
      auth.signOut();
      location.reload();
    }

    function resendVerification() {
      auth.currentUser.sendEmailVerification().then(() => {
        alert("Verification email sent to " + auth.currentUser.email);
      });
    }

    function checkVerification() {
      auth.currentUser.reload().then(() => {
        if (auth.currentUser.emailVerified) {
          location.reload();
        } else {
          alert("Still not verified.");
        }
      });
    }

    function exportCSV(type) {
      let table = (type === 'payments') ? $("paymentsTable") : $("portfolioTable");
      let csv = [];
      for (let row of table.rows) {
        let cols = Array.from(row.cells).map(cell => `"${cell.innerText}"`);
        csv.push(cols.join(","));
      }
      let blob = new Blob([csv.join("\n")], { type: 'text/csv' });
      let a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${type}-data.csv`;
      a.click();
    }

    function addProject() {
      const title = $("projectTitle").value;
      const image = $("projectImage").value;
      const link = $("projectLink").value;
      db.ref("portfolio").push({ title, image, link });
    }

    function deleteEntry(type, key) {
      db.ref(type).child(key).remove();
    }

    function changeRole(uid, role) {
      rolesRef.child(uid).set({ role });
    }

    auth.onAuthStateChanged(user => {
      if (!user) return $("loginForm").style.display = "block";
      if (!user.emailVerified) return $("verifyEmail").classList.remove("hidden");

      $("currentUserEmail").innerText = user.email;

      rolesRef.child(user.uid).once("value", snap => {
        const role = snap.val()?.role || "viewer";
        $("currentUserRole").innerText = role;

        if (user.email === superAdmin) $("manageUsersSection").style.display = "block";

        $("loginForm").style.display = "none";
        $("verifyEmail").classList.add("hidden");
        $("adminPanel").style.display = "block";

        db.ref("payments").on("value", snap => {
          const tbody = $("paymentsTable").querySelector("tbody");
          tbody.innerHTML = "";
          snap.forEach(child => {
            const data = child.val();
            const row = `<tr>
              <td>${data.name}</td><td>${data.email}</td><td>${data.account}</td><td>${data.message}</td>
              <td><button onclick="deleteEntry('payments','${child.key}')">Delete</button></td>
            </tr>`;
            tbody.innerHTML += row;
          });
        });

        db.ref("portfolio").on("value", snap => {
          const tbody = $("portfolioTable").querySelector("tbody");
          tbody.innerHTML = "";
          snap.forEach(child => {
            const data = child.val();
            const row = `<tr>
              <td>${data.title}</td><td><img src="${data.image}" width="50"></td><td><a href="${data.link}" target="_blank">View</a></td>
              <td><button onclick="deleteEntry('portfolio','${child.key}')">Delete</button></td>
            </tr>`;
            tbody.innerHTML += row;
          });
        });

        if (user.email === superAdmin) {
          rolesRef.on("value", snap => {
            const tbody = $("userTable").querySelector("tbody");
            tbody.innerHTML = "";
            snap.forEach(child => {
              const userId = child.key;
              const userRole = child.val().role;
              firebase.database().ref("users/" + userId + "/email").once("value", emailSnap => {
                const email = emailSnap.val() || "[unknown]";
                const row = `<tr>
                  <td>${email}</td>
                  <td>${userRole}</td>
                  <td>
                    <select onchange="changeRole('${userId}', this.value)">
                      <option value="viewer" ${userRole === 'viewer' ? 'selected' : ''}>Viewer</option>
                      <option value="editor" ${userRole === 'editor' ? 'selected' : ''}>Editor</option>
                      <option value="admin" ${userRole === 'admin' ? 'selected' : ''}>Admin</option>
                    </select>
                  </td>
                </tr>`;
                tbody.innerHTML += row;
              });
            });
          });
        }
      });
    });
  </script>

</body>
</html>

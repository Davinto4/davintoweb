<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Davinto Admin</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="login-section">
    <h2>Login to Admin Panel</h2>
    <input type="email" id="email" placeholder="Email" /><br />
    <input type="password" id="password" placeholder="Password" /><br />
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button><br>
    <button onclick="resendVerification()">Resend Verification Email</button>
  </div>

  <div id="dashboard" style="display:none;">
    <h2>Welcome to Admin Dashboard</h2>
    <p id="roleDisplay"></p>
    <button onclick="logout()">Logout</button>
    <!-- Add admin dashboard contents here -->
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
    authDomain: "davintoweb-payments.firebaseapp.com",
    databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
    projectId: "davintoweb-payments",
    storageBucket: "davintoweb-payments.appspot.com",
    messagingSenderId: "667742200333",
    appId: "1:667742200333:web:cf75f6cef6798eed432b44"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const SUPER_ADMIN_EMAIL = "macdinodavinto@gmail.com";

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      if (!user.emailVerified && user.email !== SUPER_ADMIN_EMAIL) {
        alert("Please verify your email.");
        auth.signOut();
        return;
      }

      const uid = user.uid;
      const rolesRef = db.ref("roles/" + uid);

      rolesRef.once("value", async (snapshot) => {
        if (!snapshot.exists()) {
          const defaultRole = user.email === SUPER_ADMIN_EMAIL ? "superadmin" : "viewer";
          const autoApproved = user.email === SUPER_ADMIN_EMAIL;

          await rolesRef.set({
            role: defaultRole,
            approved: autoApproved
          });

          if (!autoApproved) {
            alert("Your account is awaiting approval by the super admin.");
            auth.signOut();
            return;
          }
        } else {
          const { role, approved } = snapshot.val();

          if (!approved) {
            alert("Your account is not yet approved.");
            auth.signOut();
            return;
          }

          document.getElementById("login-section").style.display = "none";
          document.getElementById("dashboard").style.display = "block";
          document.getElementById("roleDisplay").innerText = "Logged in as: " + role;
        }
      });
    }
  });

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password).catch((error) => {
      alert(error.message);
    });
  }

  function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        if (email !== SUPER_ADMIN_EMAIL) {
          userCredential.user.sendEmailVerification();
          alert("Verification email sent. Please verify before logging in.");
          auth.signOut();
        }
      })
      .catch((error) => {
        alert(error.message);
      });
  }

  function resendVerification() {
    const user = auth.currentUser;
    if (user && !user.emailVerified) {
      user.sendEmailVerification().then(() => {
        alert("Verification email sent to " + user.email);
      });
    } else {
      alert("Login first with an unverified account.");
    }
  }

  function logout() {
    auth.signOut();
    document.getElementById("login-section").style.display = "block";
    document.getElementById("dashboard").style.display = "none";
  }
</script>
</body>
</html>

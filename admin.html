<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Confirmed Payments</h2>
  <table border="1" id="paymentsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Account Used</th>
        <th>Message</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="paymentsBody"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const paymentsRef = ref(db, "payments");
    const paymentsBody = document.getElementById("paymentsBody");

    onValue(paymentsRef, (snapshot) => {
      paymentsBody.innerHTML = "";
      const data = snapshot.val();
      if (data) {
        Object.values(data).forEach(entry => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${entry.name}</td>
            <td>${entry.email}</td>
            <td>${entry.account}</td>
            <td>${entry.message || ""}</td>
            <td>${new Date(entry.timestamp).toLocaleString()}</td>
          `;
          paymentsBody.appendChild(row);
        });
      }
    });
  </script>
</body>
</html>

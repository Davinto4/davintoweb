<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DavintoWeb Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 8px; border: 1px solid #ccc; text-align: left; }
    input, textarea, select, button { padding: 8px; margin: 5px; width: 100%; box-sizing: border-box; }
    .admin-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 30px; }
    .button-primary { background-color: #007BFF; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    .button-primary:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <div id="loginForm" class="admin-section">
    <h2>Login to Admin</h2>
    <input type="email" id="email" placeholder="Email" aria-label="Enter your email">
    <input type="password" id="password" placeholder="Password" aria-label="Enter your password">
    <button class="button-primary" onclick="login()">Login</button>
  </div>

  <div id="adminPanel" class="hidden">

    <div class="admin-section">
      <h2>Post New Portfolio Project</h2>
      <input type="text" id="projectTitle" placeholder="Project Title" aria-label="Enter project title">
      <input type="text" id="projectImage" placeholder="Image URL" aria-label="Enter image URL">
      <textarea id="projectDesc" placeholder="Project Description" aria-label="Enter project description"></textarea>
      <button class="button-primary" onclick="postProject()">Post Project</button>
    </div>

    <div class="admin-section">
      <h2>Portfolio Projects</h2>
      <table id="portfolioTable">
        <thead>
          <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Image</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="admin-section">
      <h2>Payment Confirmations</h2>
      <button class="button-primary" onclick="exportTableToCSV('payments.csv', 'paymentsTable')">Export Payments CSV</button>
      <table id="paymentsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Account</th>
            <th>Message</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="admin-section">
      <h2>Manage Users & Roles</h2>
      <table id="rolesTable">
        <thead>
          <tr>
            <th>UID</th>
            <th>Email</th>
            <th>Role</th>
            <th>Set Role</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="admin-section">
      <h2>Send Message to Users</h2>
      <input type="text" id="messageTo" placeholder="User UID" aria-label="Enter user UID">
      <textarea id="messageBody" placeholder="Your message here" aria-label="Enter your message"></textarea>
      <button class="button-primary" onclick="sendMessage()">Send</button>
    </div>

    <button class="button-primary" onclick="logout()">Logout</button>
  </div>

  <!-- Firebase SDK -->
  <script type="module" src="admin.js"></script>

</body>
</html>

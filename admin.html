<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DavintoWeb Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    .hidden { display: none; }
    .panel, .login-box, .verify- { padding: 20px; background: white; border-radius: 10px; max-width: 800px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #007bff; color: white; }
    input, textarea { width: 100%; padding: 8px; margin: 5px 0; }
  </style>
</head>
<body>

<div class="login-box" id="login-box">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email" /><br />
  <input type="password" id="password" placeholder="Password" /><br />
  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up</button>
</div>

<div class="verify-box hidden" id="verify-box">
  <h3>Please verify your email</h3>
  <p>Check your inbox or spam for a verification link.</p>
  <button onclick="resendVerification()">Resend Verification</button>
</div>

<div class="panel hidden" id="admin-panel">
  <h1>DavintoWeb Admin Panel</h1>
  <p id="role-label"></p>
  <button onclick="logout()">Logout</button>

  <h2>Post New Project</h2>
  <input type="text" id="projectTitle" placeholder="Project Title" />
  <input type="text" id="projectImage" placeholder="Image URL" />
  <textarea id="projectDesc" placeholder="Project Description"></textarea>
  <button onclick="postProject()">Post</button>

  <h2>Portfolio Items</h2>
  <table id="portfolioTable"><thead><tr><th>Title</th><th>Description</th><th>Image</th><th>Actions</th></tr></thead><tbody></tbody></table>

  <h2>Payments</h2>
  <button onclick="exportCSV('payments')">Export Payments CSV</button>
  <table id="paymentsTable"><thead><tr><th>Name</th><th>Email</th><th>Account</th><th>Message</th></tr></thead><tbody></tbody></table>

  <h2>User Roles</h2>
  <table id="rolesTable"><thead><tr><th>Email</th><th>Role</th><th>Set Role</th></tr></thead><tbody></tbody></table>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
    authDomain: "davintoweb-payments.firebaseapp.com",
    databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
    projectId: "davintoweb-payments",
    storageBucket: "davintoweb-payments.appspot.com",
    messagingSenderId: "667742200333",
    appId: "1:667742200333:web:cf75f6cef6798eed432b44"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const loginBox = document.getElementById('login-box');
  const verifyBox = document.getElementById('verify-box');
  const adminPanel = document.getElementById('admin-panel');
  const roleLabel = document.getElementById('role-label');

  const SUPER_ADMIN = "macdinodavinto@gmail.com";

  function login() {
    const email = emailInput.value;
    const pass = passwordInput.value;
    auth.signInWithEmailAndPassword(email, pass).catch(alert);
  }

  function signup() {
    const email = emailInput.value;
    const pass = passwordInput.value;
    auth.createUserWithEmailAndPassword(email, pass).then(userCred => {
      userCred.user.sendEmailVerification();
      alert("Verification email sent!");
    }).catch(alert);
  }

  function resendVerification() {
    const user = auth.currentUser;
    if (user) user.sendEmailVerification().then(() => alert("Verification sent."));
  }

  function logout() {
    auth.signOut();
  }

  function checkRole(uid) {
    return db.ref(`roles/${uid}/role`).get().then(snap => snap.val() || "none");
  }

  auth.onAuthStateChanged(async user => {
    if (!user) {
      loginBox.classList.remove('hidden');
      verifyBox.classList.add('hidden');
      adminPanel.classList.add('hidden');
      return;
    }

    if (!user.emailVerified) {
      loginBox.classList.add('hidden');
      verifyBox.classList.remove('hidden');
      adminPanel.classList.add('hidden');
      return;
    }

    const uid = user.uid;
    const email = user.email;
    let role = await checkRole(uid);

    if (email === SUPER_ADMIN && role === "none") {
      db.ref(`roles/${uid}`).set({ role: "admin", email });
      role = "admin";
    }

    if (role === "none") {
      alert("Access denied. Awaiting super admin approval.");
      logout();
      return;
    }

    loginBox.classList.add('hidden');
    verifyBox.classList.add('hidden');
    adminPanel.classList.remove('hidden');
    roleLabel.innerText = `Logged in as: ${email} (${role})`;

    loadPayments();
    loadPortfolio();
    if (role === "admin") loadRoles();
  });

  function postProject() {
    const title = projectTitle.value;
    const desc = projectDesc.value;
    const img = projectImage.value;
    const id = Date.now();
    db.ref("portfolio/" + id).set({ title, desc, img });
  }

  function loadPortfolio() {
    db.ref("portfolio").on("value", snap => {
      const tbody = document.querySelector("#portfolioTable tbody");
      tbody.innerHTML = "";
      snap.forEach(child => {
        const val = child.val();
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${val.title}</td>
          <td>${val.desc}</td>
          <td><img src="${val.img}" width="50" /></td>
          <td><button onclick="deleteEntry('portfolio','${child.key}')">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });
    });
  }

  function loadPayments() {
    db.ref("payments").on("value", snap => {
      const tbody = document.querySelector("#paymentsTable tbody");
      tbody.innerHTML = "";
      snap.forEach(child => {
        const val = child.val();
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${val.name}</td><td>${val.email}</td><td>${val.account}</td><td>${val.message}</td>`;
        tbody.appendChild(tr);
      });
    });
  }

  function loadRoles() {
    db.ref("roles").once("value", snap => {
      const tbody = document.querySelector("#rolesTable tbody");
      tbody.innerHTML = "";
      snap.forEach(child => {
        const uid = child.key;
        const { role, email } = child.val();
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${email}</td>
          <td>${role}</td>
          <td>
            <select onchange="setUserRole('${uid}', this.value)">
              <option ${role==='viewer'?'selected':''}>viewer</option>
              <option ${role==='editor'?'selected':''}>editor</option>
              <option ${role==='admin'?'selected':''}>admin</option>
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      });
    });
  }

  function setUserRole(uid, role) {
    db.ref(`roles/${uid}`).update({ role });
    alert("Role updated.");
  }

  function deleteEntry(path, key) {
    db.ref(`${path}/${key}`).remove();
  }

  function exportCSV(path) {
    db.ref(path).once("value", snap => {
      const rows = [["Name", "Email", "Account", "Message"]];
      snap.forEach(child => {
        const val = child.val();
        rows.push([val.name, val.email, val.account, val.message]);
      });

      let csv = rows.map(e => e.join(",")).join("\n");
      let blob = new Blob([csv], { type: "text/csv" });
      let link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${path}.csv`;
      link.click();
    });
  }
</script>

</body>
</html>

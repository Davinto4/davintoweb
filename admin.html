<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - DavintoWeb</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .hidden { display: none; }
    .modal { background: rgba(0,0,0,0.6); position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; }
    .admin-section { margin: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>
  <div id="auth-section">
    <h2>Admin Login</h2>
    <input type="email" id="login-email" placeholder="Email" required><br>
    <input type="password" id="login-password" placeholder="Password" required><br>
    <button onclick="login()">Login</button><br>
    <small><a href="#" onclick="resendVerificationEmail()">Resend Verification Email</a></small>
  </div>  <div id="dashboard-section" class="hidden">
    <h1>Welcome to Admin Dashboard</h1>
    <p id="user-role"></p>
    <button onclick="logout()">Logout</button><div class="admin-section">
  <h2>Payments</h2>
  <button onclick="exportToCSV('payments')">Export Payments CSV</button>
  <table id="payments-table"></table>
</div>

<div class="admin-section">
  <h2>Portfolio</h2>
  <form id="portfolio-form">
    <input type="text" id="project-title" placeholder="Project Title" required><br>
    <input type="url" id="project-link" placeholder="Project Link" required><br>
    <textarea id="project-description" placeholder="Description" required></textarea><br>
    <button type="submit">Add Project</button>
  </form>
  <button onclick="exportToCSV('portfolio')">Export Portfolio CSV</button>
  <table id="portfolio-table"></table>
</div>

  </div>  <!-- Edit/Delete Modal -->  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Edit Entry</h3>
      <form id="edit-form"></form>
      <button onclick="saveEdit()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>  <script type="module" src="admin.js"></script></body>
</html>

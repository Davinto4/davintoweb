<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard - DavintoWeb</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    /* Basic layout */
    body { font-family: Arial; background: #f4f4f4; padding: 20px; }
    .hidden { display: none; }
    table, th, td { border: 1px solid #aaa; border-collapse: collapse; padding: 6px; }
    th { background: #333; color: #fff; }
    button { margin: 5px; }
  </style>
</head>
<body>
  <h2>Welcome to DavintoWeb Admin Dashboard</h2>
  <button onclick="logout()">Logout</button>
  <button onclick="resendVerification()">Resend Email Verification</button>
  <p id="role-status"></p>

  <!-- Portfolio Section -->
  <h3>Portfolio Manager</h3>
  <form id="portfolioForm">
    <input type="text" id="projectTitle" placeholder="Project Title" required>
    <input type="text" id="projectURL" placeholder="Project URL" required>
    <button type="submit">Add Project</button>
  </form>
  <table id="portfolioTable">
    <thead><tr><th>Title</th><th>URL</th><th>Actions</th></tr></thead>
    <tbody></tbody>
  </table>
  <button onclick="exportCSV('portfolio')">Export Portfolio CSV</button>

  <!-- Payment Section -->
  <h3>Payment Confirmations</h3>
  <table id="paymentTable">
    <thead><tr><th>Name</th><th>Email</th><th>Account</th><th>Service</th><th>Message</th><th>Time</th><th>Action</th></tr></thead>
    <tbody></tbody>
  </table>
  <button onclick="exportCSV('payments')">Export Payments CSV</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUserRole = "";

    auth.onAuthStateChanged(async user => {
      if (!user || !user.emailVerified) {
        location.href = "admin-login.html";
        return;
      }

      const roleSnap = await db.ref("roles/" + user.uid + "/role").get();
      currentUserRole = roleSnap.exists() ? roleSnap.val() : "viewer";
      document.getElementById("role-status").innerText = "Your role: " + currentUserRole;

      loadPortfolio();
      loadPayments();

      if (currentUserRole !== "admin") {
        document.querySelectorAll(".admin-only").forEach(el => el.remove());
      }
    });

    function logout() {
      auth.signOut().then(() => location.href = "admin-login.html");
    }

    function resendVerification() {
      auth.currentUser.sendEmailVerification().then(() => {
        alert("Verification email sent.");
      });
    }

    document.getElementById("portfolioForm").addEventListener("submit", e => {
      e.preventDefault();
      if (["admin", "editor"].includes(currentUserRole)) {
        const title = document.getElementById("projectTitle").value;
        const url = document.getElementById("projectURL").value;
        const newRef = db.ref("portfolio").push();
        newRef.set({ title, url });
      } else {
        alert("Insufficient permission");
      }
    });

    function loadPortfolio() {
      const table = document.querySelector("#portfolioTable tbody");
      db.ref("portfolio").on("value", snap => {
        table.innerHTML = "";
        snap.forEach(child => {
          const { title, url } = child.val();
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${title}</td>
            <td><a href="${url}" target="_blank">${url}</a></td>
            <td>
              ${currentUserRole === "admin" ? `<button onclick="deleteItem('portfolio', '${child.key}')">Delete</button>` : ""}
            </td>
          `;
          table.appendChild(tr);
        });
      });
    }

    function loadPayments() {
      const table = document.querySelector("#paymentTable tbody");
      db.ref("confirmations").on("value", snap => {
        table.innerHTML = "";
        snap.forEach(child => {
          const { name, email, account, service, message, time } = child.val();
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${name}</td><td>${email}</td><td>${account}</td><td>${service}</td>
            <td>${message}</td><td>${time}</td>
            <td>
              ${currentUserRole === "admin" ? `<button onclick="deleteItem('confirmations', '${child.key}')">Delete</button>` : ""}
            </td>
          `;
          table.appendChild(tr);
        });
      });
    }

    function deleteItem(type, key) {
      if (currentUserRole !== "admin") return alert("Only admins can delete.");
      db.ref(`${type}/${key}`).remove();
    }

    function exportCSV(type) {
      const ref = db.ref(type === "portfolio" ? "portfolio" : "confirmations");
      ref.once("value").then(snap => {
        const data = [];
        snap.forEach(child => data.push(child.val()));
        const csv = Papa.unparse(data);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${type}.csv`;
        link.click();
      });
    }
  </script>
</body>
</html>

<!-- admin.html --><!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DavintoWeb Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    .hidden { display: none; }
    .btn { padding: 8px 16px; cursor: pointer; margin: 4px; }
    .admin-area { display: none; }
  </style>
</head>
<body>
  <h1>DavintoWeb Admin Dashboard</h1>  <div id="auth-section">
    <div id="signup-form">
      <h2>Sign Up</h2>
      <input id="signup-email" placeholder="Email" /><br />
      <input id="signup-password" type="password" placeholder="Password" /><br />
      <button class="btn" onclick="signUp()">Sign Up</button>
    </div><div id="login-form">
  <h2>Login</h2>
  <input id="login-email" placeholder="Email" /><br />
  <input id="login-password" type="password" placeholder="Password" /><br />
  <button class="btn" onclick="login()">Login</button>
</div>

  </div>  <div id="dashboard" class="admin-area">
    <h2>Welcome, <span id="user-email"></span></h2>
    <button class="btn" onclick="logout()">Logout</button><div id="role-manager" class="hidden">
  <h3>Manage User Roles</h3>
  <input id="target-email" placeholder="User Email" />
  <select id="target-role">
    <option value="viewer">Viewer</option>
    <option value="editor">Editor</option>
    <option value="admin">Admin</option>
  </select>
  <button onclick="setUserRole()">Set Role</button>
</div>

<div id="portfolio-manager">
  <h3>Post New Project</h3>
  <input id="project-title" placeholder="Project Title" />
  <input id="project-url" placeholder="Project URL" />
  <button onclick="postProject()">Post</button>
</div>

<div>
  <h3>Portfolio Projects</h3>
  <ul id="portfolio-list"></ul>
</div>

  </div>  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "667742200333",
      appId: "1:667742200333:web:cf75f6cef6798eed432b44"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const superAdminEmail = "macdinodavinto@gmail.com";

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const email = user.email;
        document.getElementById("user-email").innerText = email;
        document.getElementById("auth-section").style.display = "none";
        document.getElementById("dashboard").style.display = "block";

        if (email === superAdminEmail) {
          document.getElementById("role-manager").classList.remove("hidden");
        }

        const snapshot = await db.ref("roles/" + user.uid).once("value");
        const role = snapshot.val();

        if (email === superAdminEmail || role === "admin" || role === "editor") {
          loadPortfolio();
        } else {
          alert("Awaiting super admin approval. Please wait.");
          logout();
        }
      }
    });

    function signUp() {
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;
      auth.createUserWithEmailAndPassword(email, password)
        .then((cred) => {
          db.ref("roles/" + cred.user.uid).set("pending");
          alert("Account created. Wait for super admin approval.");
        })
        .catch((err) => alert(err.message));
    }

    function login() {
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      auth.signInWithEmailAndPassword(email, password).catch((err) => alert(err.message));
    }

    function logout() {
      auth.signOut().then(() => {
        location.reload();
      });
    }

    function setUserRole() {
      const email = document.getElementById("target-email").value;
      const role = document.getElementById("target-role").value;
      firebase.auth().fetchSignInMethodsForEmail(email).then((methods) => {
        if (methods.length) {
          firebase.database().ref("roles").once("value", (snapshot) => {
            snapshot.forEach((child) => {
              if (child.val() === "pending" || child.val() === "viewer") {
                firebase.auth().getUserByEmail?.(email).then(userRecord => {
                  db.ref("roles/" + userRecord.uid).set(role);
                  alert("Role updated");
                });
              }
            });
          });
        } else {
          alert("User not found.");
        }
      });
    }

    function postProject() {
      const title = document.getElementById("project-title").value;
      const url = document.getElementById("project-url").value;
      const key = db.ref("portfolio").push().key;
      db.ref("portfolio/" + key).set({ title, url });
      alert("Project posted");
      loadPortfolio();
    }

    function loadPortfolio() {
      db.ref("portfolio").once("value", (snapshot) => {
        const list = document.getElementById("portfolio-list");
        list.innerHTML = "";
        snapshot.forEach((child) => {
          const li = document.createElement("li");
          li.innerText = `${child.val().title} - ${child.val().url}`;
          list.appendChild(li);
        });
      });
    }
  </script></body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | DavintoWeb</title>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f7f7f7; }
    .hidden { display: none; }
    .dashboard, .login-form, .verify-message { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
    input, button, select { padding: 10px; margin: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    .danger { background-color: #ffcccc; }
    .controls { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  </style>
</head>
<body>
  <div class="login-form" id="loginForm">
    <h2>Admin Login</h2>
    <input type="email" id="loginEmail" placeholder="Email"><br>
    <input type="password" id="loginPassword" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
  </div>

  <div class="verify-message hidden" id="verifyMessage">
    <h3>Please verify your email to continue.</h3>
    <p>We’ve sent a verification email to your inbox.</p>
    <button onclick="resendVerification()">Resend Email</button>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="dashboard hidden" id="dashboard">
    <h2>Admin Dashboard</h2>
    <p id="welcomeUser"></p>
    <button onclick="logout()">Logout</button>
    
    <h3>Payments</h3>
    <div class="controls">
      <button onclick="exportPayments()">Export Payments CSV</button>
    </div>
    <table id="paymentsTable">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Account</th><th>Message</th><th>Service</th><th>Time</th><th>Action</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>Portfolio Projects</h3>
    <div class="controls">
      <input type="text" id="projectTitle" placeholder="Project Title">
      <input type="text" id="projectImage" placeholder="Image URL">
      <input type="text" id="projectLink" placeholder="Project Link">
      <button onclick="addProject()">Post Project</button>
      <button onclick="exportPortfolio()">Export Portfolio CSV</button>
    </div>
    <table id="portfolioTable">
      <thead>
        <tr><th>Title</th><th>Image</th><th>Link</th><th>Action</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="admin.js"></script>
</body>
</html>

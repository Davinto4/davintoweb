<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - DavintoWeb</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head><body>
  <div id="auth-section">
    <h2>Login to Admin Panel</h2>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <button onclick="sendVerification()">Resend Verification</button>
  </div>  <div id="admin-dashboard" style="display:none">
    <h1>Welcome to Admin Dashboard</h1>
    <p id="user-role"></p>
    <button onclick="logout()">Logout</button><section>
  <h2>Payment Confirmations</h2>
  <button onclick="exportPaymentsToCSV()">Export Payments CSV</button>
  <div id="payments"></div>
</section>

<section>
  <h2>Post New Portfolio</h2>
  <input type="text" id="projectTitle" placeholder="Title">
  <input type="text" id="projectImage" placeholder="Image URL">
  <input type="text" id="projectDesc" placeholder="Short Description">
  <input type="text" id="projectLink" placeholder="Project Link">
  <button onclick="postPortfolio()">Post</button>
</section>

<section>
  <h2>Portfolio Projects</h2>
  <button onclick="exportPortfolioToCSV()">Export Portfolio CSV</button>
  <div id="portfolio-list"></div>
</section>

<section>
  <h2>User Roles & Approvals</h2>
  <div id="user-roles"></div>
</section>

  </div>  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD***********",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "",
      appId: "1:**********"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user => {
      if (user) {
        if (user.emailVerified) {
          db.ref('roles/' + user.uid).once('value').then(snapshot => {
            const role = snapshot.val()?.role || 'pending';
            if (role === 'admin' || role === 'viewer' || role === 'editor') {
              document.getElementById('auth-section').style.display = 'none';
              document.getElementById('admin-dashboard').style.display = 'block';
              document.getElementById('user-role').innerText = `Role: ${role}`;
              loadPayments();
              loadPortfolio();
              loadUserRoles(user.email);
            } else {
              alert("You need admin approval before accessing dashboard.");
              logout();
            }
          });
        } else {
          alert("Please verify your email before continuing.");
        }
      }
    });

    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password)
        .then(userCred => {
          if (!userCred.user.emailVerified) {
            alert("Please verify your email.");
          }
        })
        .catch(err => alert(err.message));
    }

    function logout() {
      auth.signOut();
      location.reload();
    }

    function sendVerification() {
      if (auth.currentUser) {
        auth.currentUser.sendEmailVerification()
          .then(() => alert("Verification email sent"));
      }
    }

    function loadPayments() {
      const paymentsDiv = document.getElementById('payments');
      db.ref('confirmations').on('value', snap => {
        paymentsDiv.innerHTML = '';
        snap.forEach(child => {
          const val = child.val();
          const div = document.createElement('div');
          div.innerHTML = `
            <p><b>${val.name}</b> (${val.email}) - ${val.account} - ${val.message}</p>
            <button onclick="deleteEntry('confirmations', '${child.key}')">Delete</button>
          `;
          paymentsDiv.appendChild(div);
        });
      });
    }

    function loadPortfolio() {
      const list = document.getElementById('portfolio-list');
      db.ref('portfolio').on('value', snap => {
        list.innerHTML = '';
        snap.forEach(child => {
          const val = child.val();
          const div = document.createElement('div');
          div.innerHTML = `
            <h3>${val.title}</h3>
            <img src="${val.image}" width="100">
            <p>${val.description}</p>
            <a href="${val.link}" target="_blank">View</a>
            <button onclick="deleteEntry('portfolio', '${child.key}')">Delete</button>
          `;
          list.appendChild(div);
        });
      });
    }

    function postPortfolio() {
      const title = document.getElementById('projectTitle').value;
      const image = document.getElementById('projectImage').value;
      const description = document.getElementById('projectDesc').value;
      const link = document.getElementById('projectLink').value;
      db.ref('portfolio').push({ title, image, description, link })
        .then(() => alert("Project Posted"));
    }

    function deleteEntry(path, key) {
      if (confirm("Are you sure?")) {
        db.ref(`${path}/${key}`).remove();
      }
    }

    function loadUserRoles(currentEmail) {
      db.ref('roles').once('value').then(snapshot => {
        const container = document.getElementById('user-roles');
        container.innerHTML = '';
        snapshot.forEach(child => {
          const uid = child.key;
          const { role, email } = child.val();
          const div = document.createElement('div');
          div.innerHTML = `${email || uid} - ${role}`;
          if (currentEmail === 'macdinodavinto@gmail.com' && role !== 'admin') {
            div.innerHTML += ` <button onclick="approveUser('${uid}', '${email}')">Approve as Viewer</button>`;
          }
          container.appendChild(div);
        });
      });
    }

    function approveUser(uid, email) {
      db.ref(`roles/${uid}`).set({ role: 'viewer', email });
      alert("User approved");
    }

    function exportPaymentsToCSV() {
      db.ref('confirmations').once('value').then(snapshot => {
        let csv = 'Name,Email,Account,Message\n';
        snapshot.forEach(child => {
          const v = child.val();
          csv += `${v.name},${v.email},${v.account},${v.message}\n`;
        });
        downloadCSV(csv, 'payments.csv');
      });
    }

    function exportPortfolioToCSV() {
      db.ref('portfolio').once('value').then(snapshot => {
        let csv = 'Title,Image,Description,Link\n';
        snapshot.forEach(child => {
          const v = child.val();
          csv += `${v.title},${v.image},${v.description},${v.link}\n`;
        });
        downloadCSV(csv, 'portfolio.csv');
      });
    }

    function downloadCSV(csv, filename) {
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
    }
  </script></body></html>

<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <div id="loginCheck">Checking login...</div>
  <div id="dashboard" style="display:none;">
    <p>Welcome, <span id="userEmail"></span></p>
    <button onclick="logout()">Logout</button>
    <button onclick="resendVerification()">Resend Verification Email</button>

    <h3>Payments</h3>
    <table border="1" id="paymentsTable"></table>
    <button onclick="exportPayments()">Export Payments CSV</button>

    <h3>Portfolio</h3>
    <form id="portfolioForm">
      <input id="projectTitle" placeholder="Title" required>
      <input id="projectImage" placeholder="Image URL" required>
      <input id="projectDesc" placeholder="Description" required>
      <button type="submit">Post Project</button>
    </form>
    <table border="1" id="portfolioTable"></table>
    <button onclick="exportPortfolio()">Export Portfolio CSV</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "667742200333",
      appId: "1:667742200333:web:cf75f6cef6798eed432b44"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged((user) => {
      if (user && user.emailVerified) {
        document.getElementById("loginCheck").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        document.getElementById("userEmail").innerText = user.email;
        loadPayments();
        loadPortfolio();
      } else {
        window.location.href = "admin-login.html";
      }
    });

    function logout() {
      auth.signOut().then(() => location.reload());
    }

    function resendVerification() {
      const user = auth.currentUser;
      if (user && !user.emailVerified) {
        user.sendEmailVerification().then(() => {
          alert("Verification email sent again.");
        });
      }
    }

    // ---- Payments ----
    function loadPayments() {
      const table = document.getElementById("paymentsTable");
      table.innerHTML = "<tr><th>Name</th><th>Email</th><th>Account</th><th>Message</th><th>Action</th></tr>";
      db.ref("payments").on("value", (snapshot) => {
        const data = snapshot.val();
        table.innerHTML = "<tr><th>Name</th><th>Email</th><th>Account</th><th>Message</th><th>Action</th></tr>";
        for (let id in data) {
          const row = data[id];
          table.innerHTML += `
            <tr>
              <td>${row.name}</td>
              <td>${row.email}</td>
              <td>${row.account}</td>
              <td>${row.message}</td>
              <td><button onclick="deletePayment('${id}')">Delete</button></td>
            </tr>`;
        }
      });
    }

    function deletePayment(id) {
      db.ref("payments/" + id).remove();
    }

    function exportPayments() {
      db.ref("payments").once("value", snapshot => {
        const data = snapshot.val();
        const csv = Papa.unparse(Object.values(data || {}));
        downloadCSV(csv, "payments.csv");
      });
    }

    // ---- Portfolio ----
    function loadPortfolio() {
      const table = document.getElementById("portfolioTable");
      table.innerHTML = "<tr><th>Title</th><th>Image</th><th>Description</th><th>Action</th></tr>";
      db.ref("portfolio").on("value", (snapshot) => {
        const data = snapshot.val();
        table.innerHTML = "<tr><th>Title</th><th>Image</th><th>Description</th><th>Action</th></tr>";
        for (let id in data) {
          const row = data[id];
          table.innerHTML += `
            <tr>
              <td>${row.title}</td>
              <td><img src="${row.image}" width="100"/></td>
              <td>${row.description}</td>
              <td><button onclick="deleteProject('${id}')">Delete</button></td>
            </tr>`;
        }
      });
    }

    document.getElementById("portfolioForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("projectTitle").value;
      const image = document.getElementById("projectImage").value;
      const description = document.getElementById("projectDesc").value;
      db.ref("portfolio").push({ title, image, description });
      e.target.reset();
    });

    function deleteProject(id) {
      db.ref("portfolio/" + id).remove();
    }

    function exportPortfolio() {
      db.ref("portfolio").once("value", snapshot => {
        const data = snapshot.val();
        const csv = Papa.unparse(Object.values(data || {}));
        downloadCSV(csv, "portfolio.csv");
      });
    }

    function downloadCSV(content, filename) {
      const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }
  </script>
</body>
</html>

<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DavintoWeb Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }
    .hidden { display: none; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    input, textarea, button, select {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
      background: #0d1117;
      color: #fff;
      border: 1px solid #30363d;
      border-radius: 4px;
    }
    .btn {
      background: #238636;
      cursor: pointer;
    }
    .btn:hover {
      background: #2ea043;
    }
    .actions { display: flex; gap: 10px; }
    .admin-section { margin-top: 30px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
  <div class="container">
    <div id="loginSection" class="card">
      <h2>Admin Login</h2>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button class="btn" onclick="login()">Login</button>
      <p>Not verified? <a href="#" onclick="resendVerification()">Resend Verification Email</a></p>
    </div><div id="dashboardSection" class="hidden">
  <h1>Welcome, <span id="adminName"></span></h1>
  <button class="btn" onclick="logout()">Logout</button>

  <div class="admin-section">
    <h2>Post New Portfolio Project</h2>
    <input type="text" id="projectTitle" placeholder="Project Title">
    <input type="text" id="projectImage" placeholder="Image URL">
    <textarea id="projectDesc" placeholder="Project Description"></textarea>
    <input type="text" id="projectLink" placeholder="Live Link">
    <button class="btn" onclick="postProject()">Submit Project</button>
  </div>

  <div class="admin-section">
    <h2>Manage Roles</h2>
    <input type="text" id="roleEmail" placeholder="User Email">
    <select id="userRole">
      <option value="viewer">Viewer</option>
      <option value="editor">Editor</option>
      <option value="admin">Admin</option>
    </select>
    <button class="btn" onclick="assignRole()">Assign Role</button>
  </div>

  <div class="admin-section">
    <h2>Send Message to Users</h2>
    <input type="text" id="messageTitle" placeholder="Message Title">
    <textarea id="messageBody" placeholder="Message Content"></textarea>
    <button class="btn" onclick="sendMessageToUsers()">Send</button>
  </div>

  <div class="admin-section">
    <h2>Payment Confirmations</h2>
    <div id="paymentsList"></div>
    <button class="btn" onclick="exportToCSV('payments')">Export Payments as CSV</button>
  </div>

  <div class="admin-section">
    <h2>Portfolio Projects</h2>
    <div id="portfolioList"></div>
    <button class="btn" onclick="exportToCSV('portfolio')">Export Portfolio as CSV</button>
  </div>
</div>

  </div>  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "667742200333",
      appId: "1:667742200333:web:cf75f6cef6798eed432b44"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function login() {
      const email = email.value;
      const password = password.value;
      auth.signInWithEmailAndPassword(email, password)
        .then((cred) => {
          if (!cred.user.emailVerified) {
            alert("Please verify your email before proceeding.");
            return;
          }
          checkRole(cred.user.uid);
        })
        .catch(err => alert(err.message));
    }

    function resendVerification() {
      const user = auth.currentUser;
      if (user && !user.emailVerified) {
        user.sendEmailVerification()
          .then(() => alert("Verification email sent."))
          .catch(err => alert(err.message));
      } else {
        alert("Login first or already verified.");
      }
    }

    function checkRole(uid) {
      db.ref('roles/' + uid).once('value').then(snapshot => {
        const role = snapshot.val()?.role;
        if (role) {
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('dashboardSection').classList.remove('hidden');
          document.getElementById('adminName').innerText = auth.currentUser.email;
          loadPayments();
          loadPortfolio();
        } else {
          alert("Access denied: Role not assigned.");
          auth.signOut();
        }
      });
    }

    function logout() {
      auth.signOut();
      location.reload();
    }

    function postProject() {
      const title = projectTitle.value;
      const image = projectImage.value;
      const desc = projectDesc.value;
      const link = projectLink.value;
      const id = db.ref('portfolio').push().key;
      db.ref('portfolio/' + id).set({ title, image, desc, link });
      alert("Project added!");
    }

    function assignRole() {
      const email = roleEmail.value;
      auth.fetchSignInMethodsForEmail(email).then(methods => {
        auth.getUserByEmail?.(email)?.then(userRecord => {
          const uid = userRecord.uid;
          const role = userRole.value;
          db.ref('roles/' + uid).set({ role });
          alert("Role updated.");
        }).catch(() => alert("User not found."));
      });
    }

    function sendMessageToUsers() {
      const title = messageTitle.value;
      const body = messageBody.value;
      const id = db.ref('messages').push().key;
      db.ref('messages/' + id).set({ title, body });
      alert("Message sent to users.");
    }

    function loadPayments() {
      db.ref('payments').on('value', snapshot => {
        const list = document.getElementById('paymentsList');
        list.innerHTML = '';
        snapshot.forEach(child => {
          const data = child.val();
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<strong>${data.name}</strong><br>${data.email}<br>${data.account}<br>${data.message}`;
          list.appendChild(div);
        });
      });
    }

    function loadPortfolio() {
      db.ref('portfolio').on('value', snapshot => {
        const list = document.getElementById('portfolioList');
        list.innerHTML = '';
        snapshot.forEach(child => {
          const data = child.val();
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<strong>${data.title}</strong><br><img src="${data.image}" width="100"><br>${data.desc}<br><a href="${data.link}" target="_blank">Visit</a>`;
          list.appendChild(div);
        });
      });
    }

    function exportToCSV(type) {
      const ref = db.ref(type === 'payments' ? 'payments' : 'portfolio');
      ref.once('value').then(snapshot => {
        const rows = [];
        snapshot.forEach(child => rows.push(child.val()));
        let csv = Object.keys(rows[0]).join(',') + "\n";
        rows.forEach(obj => csv += Object.values(obj).join(',') + "\n");
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${type}_export.csv`;
        a.click();
      });
    }
  </script></body>
</html>

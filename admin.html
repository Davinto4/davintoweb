<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Davinto Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f9f9f9;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }
    .section {
      margin-bottom: 40px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    h2 {
      color: #333;
    }
    button {
      background: #111;
      color: #fff;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    input, textarea, select {
      padding: 8px;
      width: 100%;
      margin: 5px 0 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .hidden {
      display: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }
    .actions button {
      margin-right: 5px;
    }
  </style>
</head>
<body>

<div class="container" id="auth-container">
  <div class="card">
    <h2>Admin Login</h2>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button onclick="login()">Login</button>
    <p id="authMessage" style="color: red;"></p>
  </div>
</div>

<div class="container hidden" id="dashboard">
  <div class="section">
    <h2>Welcome, <span id="userEmail"></span> (<span id="userRole"></span>)</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Portfolio Management -->
  <div class="section card">
    <h2>Post New Portfolio</h2>
    <input type="text" id="portfolioTitle" placeholder="Project Title">
    <input type="text" id="portfolioImage" placeholder="Image URL">
    <textarea id="portfolioDesc" placeholder="Description"></textarea>
    <button onclick="postPortfolio()">Post Portfolio</button>
  </div>

  <div class="section card">
    <h2>Portfolio Entries</h2>
    <table id="portfolioTable">
      <thead><tr><th>Title</th><th>Description</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Payments Section -->
  <div class="section card">
    <h2>Payments</h2>
    <button onclick="exportCSV('payments')">Export Payments CSV</button>
    <table id="paymentsTable">
      <thead><tr><th>Name</th><th>Email</th><th>Account</th><th>Message</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Role Management -->
  <div class="section card">
    <h2>Manage Roles</h2>
    <input type="text" id="roleUID" placeholder="User UID">
    <select id="roleType">
      <option value="viewer">Viewer</option>
      <option value="editor">Editor</option>
      <option value="admin">Admin</option>
    </select>
    <button onclick="updateUserRole()">Set Role</button>
  </div>

  <!-- Messaging -->
  <div class="section card">
    <h2>Send Message to Admins</h2>
    <textarea id="adminMsg" placeholder="Enter your message..."></textarea>
    <button onclick="sendAdminMessage()">Send</button>
    <div id="messages"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
  authDomain: "davintoweb-payments.firebaseapp.com",
  databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
  projectId: "davintoweb-payments",
  storageBucket: "davintoweb-payments.appspot.com",
  messagingSenderId: "667742200333",
  appId: "1:667742200333:web:cf75f6cef6798eed432b44"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const authContainer = document.getElementById("auth-container");
const dashboard = document.getElementById("dashboard");
const userEmail = document.getElementById("userEmail");
const userRole = document.getElementById("userRole");

auth.onAuthStateChanged(user => {
  if (user) {
    userEmail.textContent = user.email;
    db.ref("roles/" + user.uid).once("value", snap => {
      const role = snap.val()?.role || "viewer";
      userRole.textContent = role;
      loadPayments();
      loadPortfolio();
      loadMessages();
      authContainer.classList.add("hidden");
      dashboard.classList.remove("hidden");
    });
  } else {
    authContainer.classList.remove("hidden");
    dashboard.classList.add("hidden");
  }
});

function login() {
  const email = document.getElementById("loginEmail").value;
  const pass = document.getElementById("loginPassword").value;
  auth.signInWithEmailAndPassword(email, pass)
    .catch(e => document.getElementById("authMessage").textContent = e.message);
}

function logout() {
  auth.signOut();
}

function postPortfolio() {
  const title = document.getElementById("portfolioTitle").value;
  const desc = document.getElementById("portfolioDesc").value;
  const image = document.getElementById("portfolioImage").value;
  const id = db.ref("portfolio").push().key;
  db.ref("portfolio/" + id).set({ title, desc, image });
}

function loadPortfolio() {
  db.ref("portfolio").on("value", snap => {
    const tbody = document.getElementById("portfolioTable").querySelector("tbody");
    tbody.innerHTML = "";
    snap.forEach(child => {
      const data = child.val();
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${data.title}</td><td>${data.desc}</td>
        <td class="actions">
          <button onclick="deleteEntry('portfolio','${child.key}')">Delete</button>
        </td>`;
      tbody.appendChild(tr);
    });
  });
}

function loadPayments() {
  db.ref("payments").on("value", snap => {
    const tbody = document.getElementById("paymentsTable").querySelector("tbody");
    tbody.innerHTML = "";
    snap.forEach(child => {
      const data = child.val();
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${data.name}</td><td>${data.email}</td><td>${data.account}</td><td>${data.message}</td>
        <td class="actions"><button onclick="deleteEntry('payments','${child.key}')">Delete</button></td>`;
      tbody.appendChild(tr);
    });
  });
}

function deleteEntry(section, key) {
  if (confirm("Are you sure you want to delete this entry?")) {
    db.ref(`${section}/${key}`).remove();
  }
}

function updateUserRole() {
  const uid = document.getElementById("roleUID").value;
  const role = document.getElementById("roleType").value;
  db.ref("roles/" + uid).set({ role });
  alert("Role updated!");
}

function exportCSV(type) {
  db.ref(type).once("value", snap => {
    let csv = [];
    snap.forEach(child => {
      const row = child.val();
      csv.push(Object.values(row).join(","));
    });
    downloadCSV(csv.join("\n"), type + ".csv");
  });
}

function downloadCSV(data, filename) {
  const blob = new Blob([data], { type: "text/csv" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

function sendAdminMessage() {
  const msg = document.getElementById("adminMsg").value;
  const id = db.ref("messages").push().key;
  db.ref("messages/" + id).set({
    from: auth.currentUser.email,
    message: msg,
    time: new Date().toLocaleString()
  });
  document.getElementById("adminMsg").value = "";
}

function loadMessages() {
  db.ref("messages").on("value", snap => {
    const box = document.getElementById("messages");
    box.innerHTML = "";
    snap.forEach(child => {
      const msg = child.val();
      const p = document.createElement("p");
      p.textContent = `${msg.time} - ${msg.from}: ${msg.message}`;
      box.appendChild(p);
    });
  });
}
</script>

</body>
</html>

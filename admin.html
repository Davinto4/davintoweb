<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Arial; background: #1e1e1e; color: white; margin: 0; padding: 20px; }
    .hidden { display: none; }
    .section { margin-top: 20px; padding: 15px; background: #2a2a2a; border-radius: 10px; }
    input, button, select { padding: 8px; margin: 5px 0; width: 100%; border-radius: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border: 1px solid #444; }
    .role-editor select { width: auto; }
    .super { color: gold; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Login Form -->
  <div id="login-section" class="section">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <button onclick="sendVerification()">Resend Verification Email</button>
    <p id="login-msg"></p>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden">
    <h2>Welcome <span id="user-role"></span>: <span id="user-email"></span></h2>
    <button onclick="logout()">Logout</button>

    <!-- Role Management (Only super admin) -->
    <div id="role-management" class="section hidden">
      <h3>User Roles Management (Super Admin Only)</h3>
      <table id="users-table"><thead><tr><th>Email</th><th>Role</th><th>Change Role</th></tr></thead><tbody></tbody></table>
    </div>

    <!-- Payment Table -->
    <div class="section">
      <h3>Payments</h3>
      <table id="payments-table"><thead><tr><th>Name</th><th>Email</th><th>Account</th><th>Message</th><th>Actions</th></tr></thead><tbody></tbody></table>
      <button onclick="exportCSV('payments')">Export Payments to CSV</button>
    </div>

    <!-- Portfolio Table -->
    <div class="section">
      <h3>Portfolio Projects</h3>
      <form id="portfolio-form">
        <input type="text" id="project-title" placeholder="Project Title" required />
        <input type="text" id="project-img" placeholder="Image URL" required />
        <input type="text" id="project-url" placeholder="Website URL" required />
        <button type="submit">Add Project</button>
      </form>
      <table id="portfolio-table"><thead><tr><th>Title</th><th>Image</th><th>URL</th><th>Actions</th></tr></thead><tbody></tbody></table>
      <button onclick="exportCSV('portfolio')">Export Portfolio to CSV</button>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
    authDomain: "davintoweb-payments.firebaseapp.com",
    databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
    projectId: "davintoweb-payments",
    storageBucket: "davintoweb-payments.appspot.com",
    messagingSenderId: "667742200333",
    appId: "1:667742200333:web:cf75f6cef6798eed432b44"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const loginSection = document.getElementById('login-section');
  const dashboard = document.getElementById('dashboard');
  const emailInput = document.getElementById('email');
  const passInput = document.getElementById('password');
  const loginMsg = document.getElementById('login-msg');

  auth.onAuthStateChanged(user => {
    if (user) {
      if (!user.emailVerified) {
        loginMsg.innerText = "Please verify your email before accessing the dashboard.";
        sendVerification();
        return;
      }
      const uid = user.uid;
      db.ref('roles/' + uid).once('value', snap => {
        let role = snap.val()?.role;
        if (!role) {
          const defaultRole = user.email === "macdinodavinto@gmail.com" ? "superadmin" : "viewer";
          db.ref('roles/' + uid).set({ role: defaultRole });
          role = defaultRole;
        }
        loadDashboard(user.email, uid, role);
      });
    } else {
      dashboard.classList.add('hidden');
      loginSection.classList.remove('hidden');
    }
  });

  function login() {
    auth.signInWithEmailAndPassword(emailInput.value, passInput.value)
    .catch(err => loginMsg.innerText = err.message);
  }

  function logout() {
    auth.signOut();
  }

  function sendVerification() {
    const user = auth.currentUser;
    if (user && !user.emailVerified) {
      user.sendEmailVerification().then(() => alert("Verification email sent."));
    }
  }

  function loadDashboard(email, uid, role) {
    loginSection.classList.add('hidden');
    dashboard.classList.remove('hidden');
    document.getElementById('user-email').innerText = email;
    document.getElementById('user-role').innerText = role.toUpperCase();

    if (role === 'superadmin') {
      document.getElementById('role-management').classList.remove('hidden');
      db.ref('roles').once('value', snap => {
        const tbody = document.querySelector('#users-table tbody');
        tbody.innerHTML = '';
        snap.forEach(child => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${child.key}</td>
            <td>${child.val().role}</td>
            <td class="role-editor">
              <select onchange="changeRole('${child.key}', this.value)">
                <option value="viewer">viewer</option>
                <option value="editor">editor</option>
                <option value="admin">admin</option>
                <option value="superadmin">superadmin</option>
              </select>
            </td>`;
          tbody.appendChild(tr);
        });
      });
    }

    loadPayments(role);
    loadPortfolio(role);

    document.getElementById('portfolio-form').onsubmit = e => {
      e.preventDefault();
      if (['editor', 'admin', 'superadmin'].includes(role)) {
        const title = document.getElementById('project-title').value;
        const img = document.getElementById('project-img').value;
        const url = document.getElementById('project-url').value;
        const key = db.ref('portfolio').push().key;
        db.ref('portfolio/' + key).set({ title, img, url });
        e.target.reset();
      } else {
        alert("Insufficient permissions to post project.");
      }
    };
  }

  function changeRole(uid, newRole) {
    db.ref('roles/' + uid).update({ role: newRole });
    alert("Role updated.");
  }

  function loadPayments(role) {
    db.ref('confirmations').on('value', snap => {
      const tbody = document.querySelector('#payments-table tbody');
      tbody.innerHTML = '';
      snap.forEach(child => {
        const data = child.val();
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${data.name}</td><td>${data.email}</td><td>${data.account}</td><td>${data.message}</td>
        <td>${['admin', 'superadmin'].includes(role) ? `<button onclick="deleteEntry('confirmations','${child.key}')">Delete</button>` : ''}</td>`;
        tbody.appendChild(tr);
      });
    });
  }

  function loadPortfolio(role) {
    db.ref('portfolio').on('value', snap => {
      const tbody = document.querySelector('#portfolio-table tbody');
      tbody.innerHTML = '';
      snap.forEach(child => {
        const data = child.val();
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${data.title}</td><td><img src="${data.img}" width="100"/></td><td><a href="${data.url}" target="_blank">${data.url}</a></td>
        <td>${['editor','admin','superadmin'].includes(role) ? `<button onclick="deleteEntry('portfolio','${child.key}')">Delete</button>` : ''}</td>`;
        tbody.appendChild(tr);
      });
    });
  }

  function deleteEntry(path, key) {
    if (confirm("Delete this entry?")) {
      db.ref(`${path}/${key}`).remove();
    }
  }

  function exportCSV(type) {
    const headers = type === 'payments' ? ['Name','Email','Account','Message'] : ['Title','Image','URL'];
    const rows = [];
    db.ref(type === 'payments' ? 'confirmations' : 'portfolio').once('value', snap => {
      snap.forEach(child => {
        const data = child.val();
        rows.push(type === 'payments' ? [data.name, data.email, data.account, data.message] : [data.title, data.img, data.url]);
      });
      let csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].map(e => e.join(",")).join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", type + "_data.csv");
      document.body.appendChild(link);
      link.click();
      link.remove();
    });
  }
</script>
</body>
</html>

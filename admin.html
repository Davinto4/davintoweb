<!DOCTYPE html>
<html>
<head>
  <title>Davinto Admin Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial; background: #0f172a; color: white; padding: 20px; }
    .hidden { display: none; }
    .card { background: #1e293b; padding: 15px; margin: 10px 0; border-radius: 10px; }
    button { padding: 8px 15px; margin: 5px; border: none; background: #3b82f6; color: white; border-radius: 5px; }
    input, select { padding: 6px; margin: 4px; }
  </style>
</head>
<body>
  <h2>Davinto Admin Dashboard</h2>

  <!-- Login Form -->
  <div id="loginDiv">
    <h3>Login</h3>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <button onclick="signup()">Signup</button>
  </div>

  <!-- Admin Dashboard -->
  <div id="dashboard" class="hidden">
    <h3>Welcome <span id="userRole"></span></h3>
    <button onclick="logout()">Logout</button>

    <!-- Super Admin Only Section -->
    <div id="roleSection" class="hidden">
      <h4>User Roles</h4>
      <div id="usersList"></div>
    </div>

    <hr>

    <h4>Post New Portfolio</h4>
    <input type="text" id="title" placeholder="Project Title">
    <input type="text" id="image" placeholder="Image URL">
    <input type="text" id="link" placeholder="Project Link">
    <button onclick="postPortfolio()">Post Project</button>

    <hr>

    <h4>Portfolio</h4>
    <div id="portfolioList"></div>

    <hr>

    <h4>Payments</h4>
    <div id="paymentList"></div>
    <button onclick="exportCSV('payments')">Export Payments CSV</button>
    <button onclick="exportCSV('portfolio')">Export Portfolio CSV</button>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
    authDomain: "davintoweb-payments.firebaseapp.com",
    databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
    projectId: "davintoweb-payments",
    storageBucket: "davintoweb-payments.appspot.com",
    messagingSenderId: "667742200333",
    appId: "1:667742200333:web:cf75f6cef6798eed432b44"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();
  const superAdmin = "macdinodavinto@gmail.com";

  function login() {
    const email = emailInput.value;
    const password = passwordInput.value;
    auth.signInWithEmailAndPassword(email, password)
      .then(() => checkRole(auth.currentUser))
      .catch(err => alert("Login failed: " + err.message));
  }

  function signup() {
    const email = emailInput.value;
    const password = passwordInput.value;
    auth.createUserWithEmailAndPassword(email, password)
      .then(cred => {
        const uid = cred.user.uid;
        db.ref("roles/" + uid).set({
          email: email,
          role: "pending",
          username: email.split("@")[0]
        });
        alert("Signup successful. Wait for super admin approval.");
        auth.signOut();
      })
      .catch(err => alert("Signup failed: " + err.message));
  }

  function logout() {
    auth.signOut().then(() => location.reload());
  }

  auth.onAuthStateChanged(user => {
    if (!user) return;
    checkRole(user);
  });

  function checkRole(user) {
    db.ref("roles/" + user.uid).once("value").then(snapshot => {
      const data = snapshot.val();
      if (!data || data.role === "pending") {
        alert("Access denied. Wait for approval.");
        logout();
        return;
      }

      dashboard.classList.remove("hidden");
      loginDiv.classList.add("hidden");
      userRole.textContent = data.role.toUpperCase();

      loadPayments();
      loadPortfolio();

      if (user.email === superAdmin) {
        roleSection.classList.remove("hidden");
        loadUsers();
      }
    });
  }

  function loadUsers() {
    db.ref("roles").on("value", snap => {
      usersList.innerHTML = "";
      snap.forEach(child => {
        const uid = child.key;
        const u = child.val();
        usersList.innerHTML += `
          <div class="card">
            <b>${u.username}</b> (${u.email}) - Role:
            <select onchange="updateRole('${uid}', this.value)">
              <option ${u.role === "viewer" ? "selected" : ""}>viewer</option>
              <option ${u.role === "editor" ? "selected" : ""}>editor</option>
              <option ${u.role === "admin" ? "selected" : ""}>admin</option>
            </select>
          </div>
        `;
      });
    });
  }

  function updateRole(uid, newRole) {
    db.ref("roles/" + uid + "/role").set(newRole);
  }

  function postPortfolio() {
    const data = {
      title: title.value,
      image: image.value,
      link: link.value,
      timestamp: Date.now()
    };
    db.ref("portfolio").push(data).then(() => {
      alert("Project posted!");
      title.value = image.value = link.value = "";
    });
  }

  function loadPortfolio() {
    db.ref("portfolio").on("value", snap => {
      portfolioList.innerHTML = "";
      snap.forEach(child => {
        const id = child.key;
        const p = child.val();
        portfolioList.innerHTML += `
          <div class="card">
            <h4>${p.title}</h4>
            <img src="${p.image}" width="100"><br>
            <a href="${p.link}" target="_blank">View Project</a><br>
            <button onclick="deleteItem('portfolio','${id}')">Delete</button>
          </div>
        `;
      });
    });
  }

  function loadPayments() {
    db.ref("payments").on("value", snap => {
      paymentList.innerHTML = "";
      snap.forEach(child => {
        const id = child.key;
        const p = child.val();
        paymentList.innerHTML += `
          <div class="card">
            <b>${p.name}</b> - ${p.email}<br>
            ${p.message} <br>
            <button onclick="deleteItem('payments','${id}')">Delete</button>
          </div>
        `;
      });
    });
  }

  function deleteItem(section, id) {
    db.ref(section + "/" + id).remove();
  }

  function exportCSV(type) {
    db.ref(type).once("value").then(snapshot => {
      let csv = "ID,Title,Email,Message,Image,Link\n";
      snapshot.forEach(child => {
        const v = child.val();
        csv += `${child.key},${v.title || ""},${v.email || ""},${v.message || ""},${v.image || ""},${v.link || ""}\n`;
      });
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = type + ".csv";
      a.click();
    });
  }

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
</script>
</body>
</html>

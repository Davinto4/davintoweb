<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    .hidden { display: none; }
    .container { background: #fff; padding: 20px; border-radius: 10px; }
    table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    th, td { padding: 10px; border: 1px solid #ddd; }
    button { padding: 8px 15px; margin: 5px; }
    input, textarea { margin: 5px 0; width: 100%; padding: 5px; }
    #login-section, #dashboard-section { max-width: 900px; margin: auto; }
    .admin-only { background: #e3f5ff; }
  </style>
</head>
<body>
  <div id="login-section" class="container">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button><br>
    <p id="verify-msg"></p>
    <button id="resend-btn" class="hidden" onclick="resendVerification()">Resend Verification Email</button>
  </div>

  <div id="dashboard-section" class="container hidden">
    <h2>Welcome, <span id="userEmail"></span></h2>
    <button onclick="logout()">Logout</button>

    <!-- Project Post -->
    <div>
      <h3>Post New Project</h3>
      <input type="text" id="projectTitle" placeholder="Title">
      <input type="text" id="projectImage" placeholder="Image URL">
      <textarea id="projectDesc" placeholder="Description"></textarea>
      <button onclick="postProject()">Post Project</button>
    </div>

    <!-- Portfolio -->
    <h3>Portfolio</h3>
    <table id="portfolioTable">
      <thead><tr><th>Title</th><th>Image</th><th>Description</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
    <button onclick="exportPortfolioCSV()">Export Portfolio CSV</button>

    <!-- Payments -->
    <h3>Payments</h3>
    <table id="paymentTable">
      <thead><tr><th>Name</th><th>Email</th><th>Account</th><th>Service</th><th>Message</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
    <button onclick="exportPaymentsCSV()">Export Payments CSV</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDp-fKxNVoGVzeS-Vm1xHMCMpuXenJ7b0Y",
      authDomain: "davintoweb-payments.firebaseapp.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "617117668385",
      appId: "1:617117668385:web:b44215fd840684fdf11320",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const loginSection = document.getElementById("login-section");
    const dashboardSection = document.getElementById("dashboard-section");
    const userEmail = document.getElementById("userEmail");

    function login() {
      const email = emailInput.value;
      const password = passwordInput.value;
      auth.signInWithEmailAndPassword(email, password)
        .then(user => {
          if (!user.user.emailVerified) {
            verifyMsg.innerText = "Please verify your email.";
            resendBtn.classList.remove("hidden");
            auth.signOut();
          } else {
            showDashboard();
          }
        }).catch(err => alert(err.message));
    }

    function register() {
      const email = emailInput.value;
      const password = passwordInput.value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(user => {
          user.user.sendEmailVerification();
          alert("Verification email sent. Please check your inbox.");
        }).catch(err => alert(err.message));
    }

    function resendVerification() {
      if (auth.currentUser) {
        auth.currentUser.sendEmailVerification()
          .then(() => alert("Verification email resent!"));
      }
    }

    function logout() {
      auth.signOut();
      loginSection.classList.remove("hidden");
      dashboardSection.classList.add("hidden");
    }

    auth.onAuthStateChanged(user => {
      if (user && user.emailVerified) {
        showDashboard();
      }
    });

    function showDashboard() {
      loginSection.classList.add("hidden");
      dashboardSection.classList.remove("hidden");
      userEmail.innerText = auth.currentUser.email;
      loadPortfolio();
      loadPayments();
    }

    function postProject() {
      const title = projectTitle.value.trim();
      const image = projectImage.value.trim();
      const desc = projectDesc.value.trim();
      if (title && image && desc) {
        const newRef = db.ref("portfolio").push();
        newRef.set({ title, image, desc });
        projectTitle.value = projectImage.value = projectDesc.value = "";
      }
    }

    function loadPortfolio() {
      db.ref("portfolio").on("value", snap => {
        const table = document.querySelector("#portfolioTable tbody");
        table.innerHTML = "";
        snap.forEach(child => {
          const data = child.val();
          table.innerHTML += `
            <tr>
              <td>${data.title}</td>
              <td><img src="${data.image}" width="50"></td>
              <td>${data.desc}</td>
              <td>
                <button onclick="deletePortfolio('${child.key}')">Delete</button>
              </td>
            </tr>`;
        });
      });
    }

    function deletePortfolio(id) {
      if (confirm("Delete project?")) db.ref("portfolio/" + id).remove();
    }

    function exportPortfolioCSV() {
      db.ref("portfolio").once("value", snap => {
        const data = [];
        snap.forEach(child => data.push(child.val()));
        const csv = Papa.unparse(data);
        downloadCSV(csv, "portfolio.csv");
      });
    }

    function loadPayments() {
      db.ref("payments").on("value", snap => {
        const table = document.querySelector("#paymentTable tbody");
        table.innerHTML = "";
        snap.forEach(child => {
          const d = child.val();
          table.innerHTML += `
            <tr>
              <td>${d.name}</td>
              <td>${d.email}</td>
              <td>${d.account}</td>
              <td>${d.service}</td>
              <td>${d.message}</td>
              <td>
                <button onclick="deletePayment('${child.key}')">Delete</button>
              </td>
            </tr>`;
        });
      });
    }

    function deletePayment(id) {
      if (confirm("Delete payment?")) db.ref("payments/" + id).remove();
    }

    function exportPaymentsCSV() {
      db.ref("payments").once("value", snap => {
        const data = [];
        snap.forEach(child => data.push(child.val()));
        const csv = Papa.unparse(data);
        downloadCSV(csv, "payments.csv");
      });
    }

    function downloadCSV(csv, filename) {
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const verifyMsg = document.getElementById("verify-msg");
    const resendBtn = document.getElementById("resend-btn");
  </script>
</body>
</html>

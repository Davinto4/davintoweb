<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - DavintoWeb</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
</head>
<body>
  <div id="login-section">
    <h2>Admin Login</h2>
    <input type="email" id="login-email" placeholder="Email" required />
    <input type="password" id="login-password" placeholder="Password" required />
    <button onclick="login()">Login</button>
    <p id="login-error" style="color:red"></p>
  </div>  <div id="dashboard" style="display:none">
    <h1>Welcome, <span id="user-role"></span></h1>
    <button onclick="logout()">Logout</button><h2>Post New Project</h2>
<input type="text" id="projectTitle" placeholder="Project Title" />
<input type="text" id="projectImage" placeholder="Image URL" />
<textarea id="projectDesc" placeholder="Description"></textarea>
<button onclick="postProject()">Post Project</button>

<h2>Portfolio</h2>
<div id="portfolio-container"></div>

<h2>Payments</h2>
<div id="payments-container"></div>

<h2>Users</h2>
<div id="users-container"></div>

  </div>  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
      authDomain: "davintoweb-payments.firebaseapp.com",
      databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
      projectId: "davintoweb-payments",
      storageBucket: "davintoweb-payments.appspot.com",
      messagingSenderId: "667742200333",
      appId: "1:667742200333:web:cf75f6cef6798eed432b44"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const SUPER_ADMIN = "macdinodavinto@gmail.com";

    function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      auth.signInWithEmailAndPassword(email, password)
        .then(userCred => {
          const uid = userCred.user.uid;
          db.ref(`roles/${uid}`).once('value').then(snapshot => {
            const role = snapshot.val()?.role;

            if (email === SUPER_ADMIN || ["admin", "editor"].includes(role)) {
              showDashboard(role);
            } else if (role === "viewer") {
              alert("Access denied. Wait for admin approval.");
              auth.signOut();
            } else {
              db.ref(`roles/${uid}`).set({ role: "pending", email });
              alert("Account pending approval by super admin.");
              auth.signOut();
            }
          });
        })
        .catch(err => {
          document.getElementById('login-error').innerText = err.message;
        });
    }

    function showDashboard(role) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('user-role').innerText = role;
      loadPayments();
      loadPortfolio();
      if (auth.currentUser.email === SUPER_ADMIN) loadUsers();
    }

    function logout() {
      auth.signOut().then(() => location.reload());
    }

    function loadPayments() {
      db.ref("payments").on("value", snapshot => {
        const data = snapshot.val();
        const container = document.getElementById("payments-container");
        container.innerHTML = '';
        for (let id in data) {
          container.innerHTML += `<div>${data[id].name} - ${data[id].email} <button onclick="deletePayment('${id}')">Delete</button></div>`;
        }
      });
    }

    function deletePayment(id) {
      db.ref(`payments/${id}`).remove();
    }

    function postProject() {
      const title = document.getElementById("projectTitle").value;
      const image = document.getElementById("projectImage").value;
      const desc = document.getElementById("projectDesc").value;
      const id = Date.now();
      db.ref(`portfolio/${id}`).set({ title, image, desc });
    }

    function loadPortfolio() {
      db.ref("portfolio").on("value", snapshot => {
        const data = snapshot.val();
        const container = document.getElementById("portfolio-container");
        container.innerHTML = '';
        for (let id in data) {
          const p = data[id];
          container.innerHTML += `<div><h4>${p.title}</h4><img src="${p.image}" width="100"/><p>${p.desc}</p><button onclick="deleteProject('${id}')">Delete</button></div>`;
        }
      });
    }

    function deleteProject(id) {
      db.ref(`portfolio/${id}`).remove();
    }

    function loadUsers() {
      db.ref("roles").on("value", snapshot => {
        const data = snapshot.val();
        const container = document.getElementById("users-container");
        container.innerHTML = '';
        for (let uid in data) {
          const { email, role } = data[uid];
          container.innerHTML += `
            <div>
              ${email} - <strong>${role}</strong>
              <select onchange="updateRole('${uid}', this.value)">
                <option value="pending" ${role === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="viewer" ${role === 'viewer' ? 'selected' : ''}>Viewer</option>
                <option value="editor" ${role === 'editor' ? 'selected' : ''}>Editor</option>
                <option value="admin" ${role === 'admin' ? 'selected' : ''}>Admin</option>
              </select>
            </div>`;
        }
      });
    }

    function updateRole(uid, newRole) {
      db.ref(`roles/${uid}/role`).set(newRole);
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        login();
      }
    });
  </script></body>
</html>

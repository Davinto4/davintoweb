<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - DavintoWeb</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 0;
    }
    .container {
      padding: 2rem;
    }
    .hidden { display: none; }
    button, input, select {
      padding: 0.5rem;
      margin: 0.5rem;
      background: #333;
      color: #fff;
      border: 1px solid #555;
    }
    table {
      width: 100%;
      margin-top: 1rem;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #444;
      padding: 0.5rem;
      text-align: left;
    }
    h2 {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
<div class="container">
  <div id="loginSection">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>

  <div id="dashboard" class="hidden">
    <h2>Welcome, <span id="userEmail"></span> (<span id="userRole"></span>)</h2>
    <button onclick="logout()">Logout</button>

    <div id="adminPanel" class="hidden">
      <h3>Manage Roles</h3>
      <input id="targetUID" placeholder="User UID"/>
      <select id="newRole">
        <option value="viewer">Viewer</option>
        <option value="editor">Editor</option>
        <option value="admin">Admin</option>
      </select>
      <button onclick="setRole()">Update Role</button>

      <h3>Send Message to User</h3>
      <input id="msgUID" placeholder="User UID"/>
      <input id="messageText" placeholder="Your message"/>
      <button onclick="sendMessage()">Send</button>
    </div>

    <h2>Payments</h2>
    <button onclick="exportCSV('payments')">Export Payments CSV</button>
    <table id="paymentsTable">
      <thead><tr><th>Name</th><th>Email</th><th>Account</th><th>Message</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2>Portfolio</h2>
    <button onclick="exportCSV('portfolio')">Export Portfolio CSV</button>
    <h4>Add Project</h4>
    <input id="projectTitle" placeholder="Title" />
    <input id="projectImage" placeholder="Image URL" />
    <input id="projectDesc" placeholder="Description" />
    <button onclick="postProject()">Post</button>

    <table id="portfolioTable">
      <thead><tr><th>Title</th><th>Image</th><th>Description</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getDatabase, ref, set, push, onValue, remove, update
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBz7fdasuQLxIFLq2TJzPAQrDTJq6h_YT8",
    authDomain: "davintoweb-payments.firebaseapp.com",
    databaseURL: "https://davintoweb-payments-default-rtdb.firebaseio.com",
    projectId: "davintoweb-payments",
    storageBucket: "davintoweb-payments.appspot.com",
    messagingSenderId: "667742200333",
    appId: "1:667742200333:web:cf75f6cef6798eed432b44"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth();
  const db = getDatabase();

  const loginSection = document.getElementById("loginSection");
  const dashboard = document.getElementById("dashboard");
  const adminPanel = document.getElementById("adminPanel");
  const userEmailSpan = document.getElementById("userEmail");
  const userRoleSpan = document.getElementById("userRole");

  function login() {
    const email = emailInput.value;
    const password = passwordInput.value;
    signInWithEmailAndPassword(auth, email, password).catch(alert);
  }

  function signup() {
    const email = emailInput.value;
    const password = passwordInput.value;
    createUserWithEmailAndPassword(auth, email, password).then((cred) => {
      set(ref(db, "roles/" + cred.user.uid), { role: "viewer" });
      alert("Account created as viewer. Contact superadmin to upgrade.");
    }).catch(alert);
  }

  function logout() {
    signOut(auth);
  }

  function setRole() {
    const uid = document.getElementById("targetUID").value;
    const role = document.getElementById("newRole").value;
    set(ref(db, "roles/" + uid), { role });
    alert("Role updated");
  }

  function sendMessage() {
    const uid = document.getElementById("msgUID").value;
    const msg = document.getElementById("messageText").value;
    push(ref(db, "messages/" + uid), { msg, from: auth.currentUser.email });
    alert("Message sent");
  }

  function exportCSV(type) {
    const rows = [["Name/Title", "Email/Image", "Account/Desc", "Message"]];
    const table = type === "payments" ? paymentsTable : portfolioTable;
    [...table.querySelectorAll("tbody tr")].forEach(row => {
      const cells = [...row.querySelectorAll("td")].slice(0, 4).map(td => td.innerText);
      rows.push(cells);
    });
    const csv = rows.map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${type}.csv`;
    link.click();
  }

  function postProject() {
    const title = projectTitle.value;
    const image = projectImage.value;
    const desc = projectDesc.value;
    push(ref(db, "portfolio"), { title, image, desc });
    alert("Posted!");
  }

  function deleteEntry(path) {
    if (confirm("Delete this entry?")) remove(ref(db, path));
  }

  function updateUI(role) {
    loginSection.classList.add("hidden");
    dashboard.classList.remove("hidden");
    userEmailSpan.textContent = auth.currentUser.email;
    userRoleSpan.textContent = role;
    if (role === "admin" || role === "superadmin") {
      adminPanel.classList.remove("hidden");
    }

    onValue(ref(db, "payments"), snap => {
      const table = document.getElementById("paymentsTable").querySelector("tbody");
      table.innerHTML = "";
      snap.forEach(child => {
        const val = child.val();
        table.innerHTML += `
          <tr>
            <td>${val.name}</td>
            <td>${val.email}</td>
            <td>${val.account}</td>
            <td>${val.message}</td>
            <td><button onclick="deleteEntry('payments/${child.key}')">🗑</button></td>
          </tr>`;
      });
    });

    onValue(ref(db, "portfolio"), snap => {
      const table = document.getElementById("portfolioTable").querySelector("tbody");
      table.innerHTML = "";
      snap.forEach(child => {
        const val = child.val();
        table.innerHTML += `
          <tr>
            <td>${val.title}</td>
            <td><img src="${val.image}" width="60"/></td>
            <td>${val.desc}</td>
            <td><button onclick="deleteEntry('portfolio/${child.key}')">🗑</button></td>
          </tr>`;
      });
    });
  }

  onAuthStateChanged(auth, user => {
    if (user) {
      onValue(ref(db, "roles/" + user.uid), snap => {
        const role = snap.val()?.role || "viewer";
        updateUI(role);
      });
    } else {
      loginSection.classList.remove("hidden");
      dashboard.classList.add("hidden");
    }
  });

  // Shortcuts
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  window.deleteEntry = deleteEntry;

</script>
</body>
</html>
